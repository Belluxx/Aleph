[workspace]
resolver = "3"
members = ["aleph_scene", "aleph_view"]

[workspace.dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["3d", "ui", "jpeg", "png"] }
avian3d = { version = "=0.8.0", default-features = false, features = ["3d", "parry-f32", "debug-plugin", "parallel"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Fast dependencies, quick to rebuild crates of our own.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# Mip generation runs on every texture at load.
[profile.dev.package.aleph_scene]
opt-level = 3
