[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alephgeo"
version = "0.2.0"
description = "Capture Street View photos, satellite imagery, and OpenStreetMap data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10", "numpy>=1.25", "truststore>=0.10"]

[project.scripts]
alephgeo = "alephgeo.main:main"

[tool.setuptools.packages.find]
include = ["alephgeo*"]

[tool.setuptools.package-data]
alephgeo = ["web/*", "web/icons/*"]
