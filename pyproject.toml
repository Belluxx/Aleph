[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alephgeo"
version = "0.1.0"
description = "Capture Street View photos, satellite imagery, and OpenStreetMap data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]

[project.scripts]
alephgeo = "aleph:main"

[tool.setuptools]
py-modules = ["aleph"]
packages = ["src"]

[tool.setuptools.package-data]
src = ["assets/*", "assets/vendor/*"]
